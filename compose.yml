services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: pg
    ports:
      - 127.0.0.1:55432:5432
    environment:
      POSTGRES_PASSWORD: mypassword
    volumes:
      - type: bind
        source: ./postgres_data
        target: /var/lib/postgresql

volumes:
  postgres_data:
